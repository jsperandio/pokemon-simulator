<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POKéMON Simulator</title>
  <style>
    html, body { margin: 0; height: 100%; background: #008080; }
  </style>
</head>
<body>
  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("pokemon-simulator.wasm"), go.importObject)
      .then((result) => go.run(result.instance))
      .catch((err) => { document.body.textContent = "Failed to load the game: " + err; });
  </script>
</body>
</html>
